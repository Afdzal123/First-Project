<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>eHailing System</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    h2 { color: #2c3e50; }
    form, .dashboard { margin-top: 20px; padding: 20px; background: #fff; border-radius: 8px; }
    input, select, button { margin-top: 10px; display: block; width: 100%; padding: 10px; border-radius: 4px; border: 1px solid #ccc; }
    button { background-color: #3498db; color: white; border: none; }
    button:hover { background-color: #2980b9; }
  </style>
</head>
<body>
  <h2>eHailing Login</h2>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>

  <div id="dashboard" class="dashboard" style="display:none">
    <h2>Dashboard</h2>
    <div id="roleContent"></div>
    <button onclick="logout()">Logout</button>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      let token = '';
      let role = '';

      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        console.log("Login form submitted");

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const res = await fetch('/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok) {
          token = data.token;
          role = data.role;
          document.getElementById('loginForm').style.display = 'none';
          document.getElementById('dashboard').style.display = 'block';
          loadDashboard();
        } else {
          alert(data.error);
        }
      });

      function logout() {
        token = '';
        role = '';
        document.getElementById('loginForm').style.display = 'block';
        document.getElementById('dashboard').style.display = 'none';
        document.getElementById('roleContent').innerHTML = '';
      }

      async function loadDashboard() {
        const content = document.getElementById('roleContent');
        content.innerHTML = '';

        if (role === 'admin') {
          content.innerHTML = '<p>Welcome Admin! You can manage users and view analytics.</p>';
        } else if (role === 'driver') {
          content.innerHTML = '<p>Welcome Driver! Check your rides and accept jobs.</p>';
        } else if (role === 'passenger') {
          content.innerHTML = '<p>Welcome Passenger! Request a ride below.</p>' +
            '<form id="rideRequestForm">' +
            '<input type="text" id="pickup" placeholder="Pickup Location" required />' +
            '<input type="text" id="destination" placeholder="Destination" required />' +
            '<input type="number" id="fare" placeholder="Fare" required />' +
            '<input type="number" id="distance" placeholder="Distance (km)" required />' +
            '<button type="submit">Request Ride</button>' +
            '</form>';

          document.getElementById('rideRequestForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const pickup = document.getElementById('pickup').value;
            const destination = document.getElementById('destination').value;
            const fare = parseFloat(document.getElementById('fare').value);
            const distance = parseFloat(document.getElementById('distance').value);

            const res = await fetch('/rides/request', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${token}`
              },
              body: JSON.stringify({ passengerId: parseJwt(token).userId, pickup, destination, fare, distance })
            });

            const data = await res.json();
            if (res.ok) alert("Ride requested!");
            else alert(data.error);
          });
        }
      }

      function parseJwt(token) {
        try {
          return JSON.parse(atob(token.split('.')[1]));
        } catch (e) {
          return null;
        }
      }
    });
  </script>
</body>
</html>
